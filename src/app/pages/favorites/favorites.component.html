<div class="page">
  <h1 class="page-title">❤️ Os Meus Favoritos</h1>

  <div *ngIf="loading" class="loading">
    <p>A carregar favoritos...</p>
  </div>

  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <div *ngIf="!loading && favorites.length === 0" class="empty-state">
    <div class="empty-icon">🍽️</div>
    <h2>Ainda não tens favoritos</h2>
    <p>Explora as receitas e guarda as tuas favoritas!</p>
    <a routerLink="/recipes" class="btn-primary">Ver Receitas</a>
  </div>

  <div *ngIf="!loading && favorites.length > 0" class="favorites-grid">
    <div *ngFor="let fav of favorites" class="favorite-card">
      <img *ngIf="fav.meal_thumb" [src]="fav.meal_thumb" [alt]="fav.meal_name" />
      <div class="card-body">
        <h3>{{ fav.meal_name }}</h3>
        <div class="card-actions">
          <a [routerLink]="['/recipes', fav.meal_id]" class="btn-view">Ver receita</a>
          <button (click)="removeFavorite(fav.meal_id)" class="btn-remove">🗑️ Remover</button>
        </div>
      </div>
    </div>
  </div>
</div>
