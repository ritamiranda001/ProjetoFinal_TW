<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="icon">🍴</div>
      <h2>Bem-vindo de volta</h2>
      <p>Entra na tua conta para aceder às tuas receitas</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="o@exemplo.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }

      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'A entrar...' : 'Entrar' }}
      </button>
    </form>

    <div class="auth-footer">
      Não tens conta? <a routerLink="/register">Regista-te aqui</a>
    </div>
  </div>
</div>
